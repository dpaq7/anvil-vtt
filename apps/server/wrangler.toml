name = "anvil-server"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
ENVIRONMENT = "development"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "anvil-db"
database_id = "placeholder-replace-with-real-id"
migrations_dir = "migrations"

# R2 Bucket
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "anvil-assets"

# Durable Objects
[durable_objects]
bindings = [
  { name = "SESSION_ROOM", class_name = "SessionRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["SessionRoom"]

[dev]
port = 8787
