name = "anvil-server"
main = "src/index.ts"
compatibility_date = "2026-05-10"
preview_urls = false
workers_dev = false

[[routes]]
pattern = "api.anvilvtt.ca"
custom_domain = true

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.05

[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://anvilvtt.ca"
DISCORD_REDIRECT_URI = "https://api.anvilvtt.ca/api/auth/callback"
GOOGLE_REDIRECT_URI = "https://api.anvilvtt.ca/api/auth/google/callback"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "anvil-db"
database_id = "f0307751-2cae-4e53-9d44-18a332f868e4"
migrations_dir = "migrations"

# R2 Bucket
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "anvil-assets"

# Durable Objects
[durable_objects]
bindings = [
  { name = "SESSION_ROOM", class_name = "SessionRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

[dev]
port = 8787
